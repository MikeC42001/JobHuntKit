name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check engine scripts tests .github
      - name: Leak gate (audit_public.py)
        run: python scripts/audit_public.py
      - name: Shellcheck
        run: shellcheck -x engine/*.sh scripts/*.sh community/*.sh

  test:
    # Pure-Python pytest suite (build/check/audit + the sync.sh leak-gate integration tests) —
    # no browser or Node.js needed. windows-latest exercises the same bash-via-subprocess path
    # already verified locally in development; macos/ubuntu confirm it's not a Windows fluke.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -v

  render-matrix:
    # First real cross-platform signal for engine/lib.sh's browser-discovery and file:// URL
    # fixes (GNU vs BSD `stat`, `file:///` slash count, `--headless=new`) — code-reviewed but,
    # until this job, only ever run live on Windows. Runs the actual demo end-to-end: build,
    # structure check, PDF render, one-page verify.
    #
    # windows-latest was added after a first run on a real Windows machine failed immediately:
    # demo.sh hardcoded `python3`, which is not a command that exists on a stock Windows install.
    # The Windows render path had never executed in CI on any commit — the `test` job's
    # windows-latest entry is pytest only, which reads like coverage it isn't. Note that this job
    # would NOT have caught that specific bug, since actions/setup-python provides `python3` here;
    # tests/test_python_bin.py is what guards the interpreter name. What this covers is the Bash
    # renderer path on the platform it was written for.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A browser that fails to exit hangs this job until the 6-hour default kills it, at 10x
    # billing on macOS. The whole job normally finishes in under a minute.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          # v2 changed this default from "latest" (a Chromium snapshot) to "stable" (Chrome for
          # Testing), which hangs indefinitely on macOS arm64 at --print-to-pdf. Pinning back to
          # the Chromium build v1 installed, which renders fine on both runners.
          chrome-version: latest
      - name: Syntax-check the tracked JS converters
        run: |
          node --check engine/render-support/cv2html.js
          node --check engine/render-support/cv2html-photo.js
          node --check engine/render-support/cv2html-minimal.js
          node --check engine/render-support/letter2html.js
      - name: Run demo.sh (build, check, render, verify)
        # `shell: bash` is Git Bash on the Windows runner, which is how a Windows user runs this
        # too. setup-chrome hands back a native drive-letter path there, and find_browser's
        # `[ -x ]` wants a POSIX one — cygpath ships with Git for Windows and is simply absent
        # elsewhere, so this converts on Windows and does nothing on Linux/macOS.
        shell: bash
        run: |
          if [ -n "${BROWSER_BIN:-}" ] && command -v cygpath >/dev/null 2>&1; then
            BROWSER_BIN="$(cygpath -u "$BROWSER_BIN")"
            export BROWSER_BIN
          fi
          bash demo.sh
        env:
          BROWSER_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
